name: Docker Build and Release (Manual)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release-Version (z.B. 2.3.0)"
        required: true
        default: "2.3.0"

      prerelease:
        description: "Als Prerelease veröffentlichen?"
        required: true
        type: choice
        default: "true"
        options:
          - "true"
          - "false"

      docker_latest:
        description: "Docker-Tag 'latest' setzen?"
        required: true
        type: choice
        default: "true"
        options:
          - "true"
          - "false"

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set version from input
        run: |
          VERSION="${{ inputs.version }}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "TAG_NAME=v$VERSION" >> $GITHUB_ENV
          echo "✅ Version gesetzt auf $VERSION"

      - name: Generate Changelog
        id: changelog
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

          if [ -z "$LAST_TAG" ]; then
            echo "Kein vorheriger Tag gefunden, nehme letzten 20 Commits"
            RAW=$(git log --pretty=format:"%s|%h|%an" -20)
          else
            echo "Changelog seit $LAST_TAG"
            RAW=$(git log ${LAST_TAG}..HEAD --pretty=format:"%s|%h|%an")
          fi

          FEATURES=""
          FIXES=""
          PERF=""
          OTHER=""

          while IFS= read -r line; do
            [ -z "$line" ] && continue
            MSG=$(echo "$line" | cut -d'|' -f1)
            HASH=$(echo "$line" | cut -d'|' -f2)
            AUTHOR=$(echo "$line" | cut -d'|' -f3)

            ENTRY="- ${MSG} (\`${HASH}\`) – ${AUTHOR}"

            case "$MSG" in
              feat*|feature*|add*|Add*|Feat*)
                FEATURES="${FEATURES}${ENTRY}"$'\n' ;;
              fix*|Fix*|bug*|Bug*|hotfix*)
                FIXES="${FIXES}${ENTRY}"$'\n' ;;
              perf*|Perf*|opt*|Opt*|speed*|latenz*|Latenz*)
                PERF="${PERF}${ENTRY}"$'\n' ;;
              *)
                OTHER="${OTHER}${ENTRY}"$'\n' ;;
            esac
          done <<< "$RAW"

          BODY=""

          if [ -n "$FEATURES" ]; then
            BODY="${BODY}### ✨ Neue Features"$'\n'"${FEATURES}"$'\n'
          fi
          if [ -n "$FIXES" ]; then
            BODY="${BODY}### 🐛 Bugfixes"$'\n'"${FIXES}"$'\n'
          fi
          if [ -n "$PERF" ]; then
            BODY="${BODY}### ⚡ Performance"$'\n'"${PERF}"$'\n'
          fi
          if [ -n "$OTHER" ]; then
            BODY="${BODY}### 🔧 Weitere Änderungen"$'\n'"${OTHER}"$'\n'
          fi

          if [ -z "$BODY" ]; then
            BODY="Keine Commits seit dem letzten Release."
          fi

          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$BODY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Build Binaries
        run: |
          GOOS=linux   GOARCH=amd64 go build -ldflags="-s -w -X main.Version=${{ env.VERSION }}" -o ionos-ddns-linux-amd64 .
          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w -X main.Version=${{ env.VERSION }}" -o ionos-ddns-windows-amd64.exe .
          GOOS=linux   GOARCH=arm64 go build -ldflags="-s -w -X main.Version=${{ env.VERSION }}" -o ionos-ddns-linux-arm64 .

      - name: Generate checksums
        run: |
          sha256sum ionos-ddns-linux-amd64 ionos-ddns-windows-amd64.exe ionos-ddns-linux-arm64 > checksums.txt
          echo "📋 Checksums:"
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Release v${{ env.VERSION }}
          prerelease: ${{ inputs.prerelease }}
          draft: false
          body: |
            ## 📋 Changelog

            ${{ steps.changelog.outputs.changelog }}

            ---

            ## 🐳 Docker

            ```bash
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/ionos-ddns:${{ env.VERSION }}
            ```

            ```yaml
            # docker-compose.yml
            image: ${{ secrets.DOCKERHUB_USERNAME }}/ionos-ddns:${{ env.VERSION }}
            ```

            ---

            ## 📦 Binaries

            | Datei | Plattform |
            |-------|-----------|
            | `ionos-ddns-linux-amd64` | Linux x86_64 |
            | `ionos-ddns-linux-arm64` | Linux ARM64 (Raspberry Pi etc.) |
            | `ionos-ddns-windows-amd64.exe` | Windows x86_64 |

            > SHA256-Checksums in `checksums.txt`
          files: |
            ionos-ddns-linux-amd64
            ionos-ddns-windows-amd64.exe
            ionos-ddns-linux-arm64
            checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ionos-ddns:${{ env.VERSION }}
            ${{ inputs.docker_latest == 'true' && format('{0}/ionos-ddns:latest', secrets.DOCKERHUB_USERNAME) || '' }}
          build-args: |
            VERSION=${{ env.VERSION }}
          labels: |
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

version: "2"

run:
  timeout: 5m
  tests: true

linters:
  disable-all: true
  enable:
    - govet
    - staticcheck
    - errcheck
    - revive
    - gocritic
    - unused
    - bodyclose

linters-settings:
  errcheck:
    exclude-functions:
      - (net/http.ResponseWriter).Write
      - (*encoding/json.Encoder).Encode
      - fmt.Fprint
      - fmt.Fprintf
      - fmt.Fprintln
      
  revive:
    ignore-generated-header: true
    severity: warning
    rules:
      - name: var-naming
        disabled: true
      - name: early-return
      - name: indent-error-flow
      - name: package-comments
      - name: blank-imports
      - name: error-return
      - name: if-return

  gocritic:
    enabled-checks:
      - ifElseChain
      - appendCombine
      - badCond
      - commentFormatting

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  exclude-rules:
    - name: var-naming
    - text: "should be"
    - text: "ST1003"

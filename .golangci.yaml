version: "2"

run:
  timeout: 5m
  tests: true

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gocyclo
    - revive
    - goconst
    - misspell
    - unconvert
    - unparam
    - gosec

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    gofumpt:
      extra-rules: true
    # optional: goimports hat settings wie local-prefixes (falls du willst)

linters-settings:
  gocyclo:
    min-complexity: 15
  revive:
    severity: warning
  goconst:
    min-len: 3
    min-occurrences: 3
  gosec:
    excludes:
      - G104

issues:
  exclude-rules:
    - linters: [errcheck]
      text: "error return value not checked"

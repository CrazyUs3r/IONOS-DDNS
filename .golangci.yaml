version: "2"

run:
  timeout: 5m
  tests: true

linters:
  disable-all: true
  enable:
    - govet
    - staticcheck
    - errcheck
    - revive
    - gocritic
    - unused
    - bodyclose
    - misspell

linters-settings:
  errcheck:
    check-blank: true
    exclude-functions:
      - (net/http.ResponseWriter).Write
      - (*encoding/json.Encoder).Encode
      - fmt.Fprint
      - fmt.Fprintf
      - fmt.Fprintln

  revive:
    ignore-generated-header: true
    severity: warning
    rules:
      - name: early-return
      - name: indent-error-flow
      - name: package-comments
      - name: blank-imports
      - name: error-return
      - name: error-naming
      - name: if-return

  gocritic:
    enabled-checks:
      - ifElseChain
      - appendCombine
      - badCond
      - commentFormatting
      - wrapperFunc

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  exclude-rules:
    - name: var-naming
      linters:
        - revive
    - text: "ST1003:"
      linters:
        - staticcheck
    - text: "should be .*API"
      linters:
        - revive
    - text: "should be .*JSON"
      linters:
        - revive
